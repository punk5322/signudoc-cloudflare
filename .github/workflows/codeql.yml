# Static analysis of the app's TypeScript and of these workflows with
# GitHub CodeQL. Findings go to the repository's Security tab.
#
# Only in the SignuDoc repository itself: a copy made by the Vercel Deploy
# button skips it (its owner can turn on CodeQL in their own settings).
# Actions are pinned to a commit, with the version beside it.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'NYLLON-SOFTWARE/SignuDoc'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

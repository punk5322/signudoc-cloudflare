# OpenSSF Scorecard: checks this repository's own security practices
# (branch protection, pinned and reviewed changes, token permissions,
# dependency updates and more) and publishes the score at
# https://scorecard.dev/viewer/?uri=github.com/NYLLON-SOFTWARE/SignuDoc.
#
# Only in the SignuDoc repository itself; a copy skips it.

name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 3"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'NYLLON-SOFTWARE/SignuDoc'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
